# 本地开发中间件编排（本地优先策略）
#
# 以下中间件已在本机以非容器方式启动，工程默认直接连接本地地址（见各工程配置文件）：
#   - MySQL   127.0.0.1:3306   用户 root / 密码 ideal0921，业务库 lingxi（启动时自动创建）
#   - Redis   127.0.0.1:6379   本地单机模式（无密码）
#   - Nacos   127.0.0.1:8848   默认账号 nacos / nacos
#
# 容器版 mysql/redis 已停用，避免与本机端口冲突；如需回归容器方案请先停止本机对应服务。
# 以下服务为可选补充：
#   - Kafka  待 M2-B 队列接线前启动（容器 单机）
#   - Milvus M3 知识库向量检索（standalone：etcd + minio + milvus，首次启动较慢）
#   - ES     M3 日志检索（应用/审计日志、对话消息全文检索）
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: lingxi-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    mem_limit: 2g

  kafka:
    image: bitnami/kafka:3.6
    container_name: lingxi-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  # ---- M3 知识库向量检索（可选，standalone：etcd + minio + milvus）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lingxi-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: lingxi-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: lingxi-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
