name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  core-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -q -B test

  ai-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  web-vue3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-vue3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
